<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="quiz-container" role="main" aria-label="Quiz Application">
            <h1 class="quiz-title" id="question"></h1>
            <ul id="options"></ul>
            <button id="submit" class="btn">Submit</button>
            <img id="cheer-img" style="display:none;max-width:180px;margin:18px auto 0;" alt="Cheer Up"/>
            <p id="feedback"></p>
            <p id="score"></p>
            <button id="next" class="btn">Next</button> <!-- Added label -->
            <p id="timer" class="timer"></p>
            <button id="restart" class="btn">Restart Quiz</button>
        </div>
        <footer style="margin-top:24px; font-size:1em; color:#888;">
            Developed by Mappillai Meeran A &copy; 2025
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
